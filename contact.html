<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Tubexh</title>
<link rel="stylesheet" type="text/css" href="css/webadelaide-main.css"/>
<link rel="stylesheet" type="text/css" href="style.css"/>
<style>
  body { background: #0f0d0d; color: #a9b4c2; font-family: Manrope, sans-serif; margin: 0; }
  .contact-hero { text-align: center; padding: 8rem 2rem 4rem; }
  .contact-hero h1 { font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 800; background: linear-gradient(90deg, #f8ffff 40%, #b65eff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 1rem; }
  .contact-hero p { font-size: 1.2rem; color: #a9b4c2; max-width: 560px; margin: 0 auto 3rem; }
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; max-width: 1100px; margin: 0 auto; padding: 2rem 2rem 6rem; }
  .contact-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(182,94,255,0.18); border-radius: 16px; padding: 2rem; }
  .contact-card h3 { color: #f8ffff; font-size: 1.3rem; margin-bottom: 1rem; }
  .contact-card a { color: #27f9fb; text-decoration: none; display: block; margin-bottom: 0.75rem; font-size: 1.05rem; }
  .contact-card a:hover { color: #b65eff; }
  .contact-form { display: flex; flex-direction: column; gap: 1rem; }
  .contact-form input, .contact-form textarea { background: rgba(255,255,255,0.05); border: 1px solid rgba(182,94,255,0.2); border-radius: 8px; padding: 0.85rem 1rem; color: #f8ffff; font-family: Manrope, sans-serif; font-size: 1rem; outline: none; }
  .contact-form input::placeholder, .contact-form textarea::placeholder { color: #6b7a8d; }
  .contact-form input:focus, .contact-form textarea:focus { border-color: #b65eff; }
  .contact-form textarea { min-height: 140px; resize: vertical; }
  .contact-form button { background: linear-gradient(90deg, #b65eff, #27f9fb); border: none; border-radius: 8px; padding: 0.9rem 2rem; color: #0f0d0d; font-weight: 700; font-size: 1rem; cursor: pointer; font-family: Manrope, sans-serif; }
  .contact-form button:hover { opacity: 0.9; }
  .back-link { display: inline-block; color: #b65eff; text-decoration: none; font-size: 0.95rem; padding: 1.5rem 2rem; }
  .back-link:hover { color: #27f9fb; }
  @media (max-width: 768px) { .contact-grid { grid-template-columns: 1fr; } .contact-hero { padding: 5rem 1.5rem 2rem; } }
</style>
</head>
<body>
<a href="index.html" class="back-link">&#8592; Back to Home</a>
<div class="contact-hero">
  <h1>Get In Touch</h1>
  <p>Ready to automate your business? Let's talk about AI agents, WhatsApp bots, and digital growth.</p>
</div>
<div class="contact-grid">
  <div class="contact-card">
    <h3>Contact Details</h3>
    <a href="tel:+919588894289">&#128222; +91 95888 94289</a>
    <a href="mailto:agency@getxh.in">&#9993; agency@getxh.in</a>
    <a href="https://wa.me/918239474289" target="_blank">&#128172; WhatsApp Us</a>
    <a href="https://www.instagram.com/tubexh" target="_blank">&#128247; @tubexh</a>
    <br>
    <p style="color:#6b7a8d;font-size:0.9rem;">C-205, RIICO Industrial Area,<br>Jaipur, Rajasthan 302001</p>
  </div>
  <div class="contact-card">
    <h3>Send a Message</h3>
    <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent! We will get back to you shortly.');">
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <input type="text" placeholder="Subject" />
      <textarea placeholder="Tell us about your project..."></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>
</div>
</body>
</html>
